name: Lint Codebase

on:
  push:
    branches:
      - main
      - unit_tests
  pull_request:
    branches:
      - main
      - dev
      - unit_tests

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
