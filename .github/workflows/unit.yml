name: Unit Tests and Coverage

on:
  push:
    branches:
      - main
      - unit_tests
  pull_request:
    branches:
      - main
      - dev
      - unit_tests

jobs:
  unit:
    name: Run unit tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run coverage
        run: npm run coverage
